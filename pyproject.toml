[project]
name = "fireball"
version = "0.1.0"
description = "Fireball — grava e transcreve reuniões, expondo tools para o Claude atuar como escrivão ao vivo."
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
]

[project.scripts]
fireball = "fireball.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fireball*"]
